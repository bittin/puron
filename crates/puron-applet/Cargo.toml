[package]
name = "puron-applet"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
puron-core.workspace = true
puron-engine.workspace = true
puron-config.workspace = true
i18n-embed.workspace = true
i18n-embed-fl.workspace = true
rust-embed.workspace = true
libc.workspace = true

# The default feature set, named in full, plus applet.
[dependencies.libcosmic]
workspace = true
features = ["winit", "tokio", "a11y", "dbus-config", "x11", "wayland", "multi-window", "applet"]

# Builds in the test catalog; for test builds only.
[features]
test-catalog = []

[dev-dependencies]
puron-applet = { path = ".", features = ["test-catalog"] }
serde_json.workspace = true
# `dump` builds the test of puron-soak's dump mode in puron-testkit;
# `cfg-writer` gives the Settings page tests a second process that stores
# a setting, as another program would.
puron-testkit = { workspace = true, features = ["dump", "cfg-writer"] }
iced_test.workspace = true
png.workspace = true
# Parses the shipped catalogs in the catalog test. Pinned to the version
# that i18n-embed already brings in, so the lock file gains no package.
fluent-syntax = "=0.12.0"
